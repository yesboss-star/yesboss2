name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: vpsuser
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "=== Deploying YesBoss ==="

            # Navigate to project
            cd ~/yesboss2

            # Discard any local changes and pull latest code
            echo "[1/5] Pulling latest code..."
            git reset --hard HEAD
            git pull origin main

            # Ensure uploads directory exists on data disk
            sudo mkdir -p /u01/docker-data/uploads

            # Provision nginx reverse proxy + SSL (idempotent, safe to re-run)
            echo "[2/5] Setting up nginx reverse proxy and SSL for vsllp.live..."
            bash ~/yesboss2/deploy/setup-server.sh

            # Build and start container
            echo "[3/5] Building Docker image..."
            docker compose build --no-cache

            echo "[4/5] Starting container..."
            docker compose up -d

            # Cleanup old images
            echo "[5/5] Cleaning up..."
            docker image prune -f

            echo "=== Deployment complete ==="
            echo "Frontend: https://vsllp.live"
            echo "Backend:  https://vsllp.live/api/v1"
            docker compose ps
